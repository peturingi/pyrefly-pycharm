pluginGroup=dk.ingi.pyreflypycharm
pluginName=pyrefly-pycharm
pluginVersion=0.1.0

# Oldest PyCharm build this plugin is built and tested against (2026.2).
pluginSinceBuild=262

# PyCharm version to build against. Downloaded unless platformLocalPath is set in local.properties
# (git-ignored) to an installed PyCharm, which skips the multi-GB download. See README.
platformVersion=2026.2.4

# LSP4IJ release to compile against (users install it from JetBrains Marketplace).
lsp4ijVersion=0.21.0

# The IDE ships its own Kotlin stdlib (2.4.0 in 2026.2); do not bundle another one.
kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
